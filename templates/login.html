<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-ui-style="liquid">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor-liquid-glass.js') }}" defer></script>
    <script src="{{ url_for('static', filename='liquid-glass-init.js') }}" defer></script>
    <script src="{{ url_for('static', filename='snow.js') }}" defer></script>
    <script src="{{ url_for('static', filename='easter.js') }}" defer></script>
    <script src="{{ url_for('static', filename='particle-interactions.js') }}" defer></script>
    <script src="{{ url_for('static', filename='season-controls.js') }}" defer></script>
</head>

<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-end gap-2 flex-wrap mb-3">
            <div class="dropdown">
                <button type="button" class="btn btn-outline-secondary dropdown-toggle appearance-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-droplet-fill" aria-hidden="true"></i>
                    <span class="style-label">Standard glass</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><button type="button" class="dropdown-item" data-ui-style-option="liquid">Standard liquid glass</button></li>
                    <li><button type="button" class="dropdown-item" data-ui-style-option="extreme">Make my GPU hurt</button></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><button type="button" class="dropdown-item" data-ui-style-option="default">Default style</button></li>
                </ul>
            </div>
            <button type="button" class="btn btn-outline-secondary theme-toggle" aria-label="Switch to light mode">
                <i class="bi bi-sun-fill" aria-hidden="true"></i>
                <span class="theme-label">Light mode</span>
            </button>
            <div class="dropdown">
                <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-stars" aria-hidden="true"></i>
                    Season: <span class="season-label">Automatic</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><button type="button" class="dropdown-item" data-season="auto">Automatic</button></li>
                    <li><button type="button" class="dropdown-item" data-season="christmas">Christmas</button></li>
                    <li><button type="button" class="dropdown-item" data-season="easter">Easter</button></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><button type="button" class="dropdown-item" data-season="off">Off</button></li>
                </ul>
            </div>
        </div>
        <div class="card mx-auto border-primary shadow-lg" style="max-width: 400px;">
            <div class="card-body">
                <h3 class="card-title text-center mb-4"><i class="bi bi-envelope-at me-2" aria-hidden="true"></i>Email Routing</h3>
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}
                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" name="username" id="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Link to Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='alerts.js') }}"></script>
</body>

</html>
